<div class="analysis-page">
  <h1>{{ 'analysis.title' | translate }}</h1>

  <mat-tab-group dynamicHeight disableRipple disablePagination animationDuration="0ms">
    <mat-tab
      [label]="'analysis.tab_dashboard' | translate"
      [attr.data-qa]="'tab-analysis-dashboard'"
    >
      <app-analysis-dashboard-tab></app-analysis-dashboard-tab>
    </mat-tab>
    <mat-tab
      [label]="'analysis.tab_report_builder' | translate"
      [attr.data-qa]="'tab-analysis-report-builder'"
    >
      <app-analysis-report-builder-tab></app-analysis-report-builder-tab>
    </mat-tab>
  </mat-tab-group>
</div>
